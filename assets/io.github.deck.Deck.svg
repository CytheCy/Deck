<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Deck</title>
  <desc id="desc">A small deck of ruled index cards</desc>

  <!-- A simple silhouette and broad strokes keep the icon clear at small sizes. -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="#6d28d9"/>

  <g transform="rotate(-9 256 256)">
    <rect x="84" y="116" width="344" height="276" rx="30" fill="#a78bfa"/>
    <rect x="84" y="116" width="344" height="276" rx="30" fill="none" stroke="#4c1d95" stroke-width="14"/>
  </g>

  <g transform="rotate(6 256 256)">
    <rect x="88" y="120" width="344" height="276" rx="30" fill="#ddd6fe"/>
    <rect x="88" y="120" width="344" height="276" rx="30" fill="none" stroke="#5b21b6" stroke-width="14"/>
  </g>

  <rect x="72" y="128" width="368" height="280" rx="30" fill="#fffdf7"/>
  <rect x="72" y="128" width="368" height="280" rx="30" fill="none" stroke="#3b176d" stroke-width="14"/>

  <!-- Classic index-card ruling. -->
  <path d="M91 212H421 M91 266H421 M91 320H421 M91 374H421"
        fill="none" stroke="#c4b5fd" stroke-width="12" stroke-linecap="round"/>
  <path d="M142 150V387" fill="none" stroke="#f43f5e" stroke-width="12" stroke-linecap="round"/>
</svg>
